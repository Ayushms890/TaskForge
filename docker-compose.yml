services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskforge}
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
    ports:
      - "5432:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskforge}:${POSTGRES_PASSWORD:-taskforge}@postgres:5432/${POSTGRES_DB:-taskforge}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-taskforge-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-taskforge-web}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  taskforge-postgres:
